{% load static %}

<!-- Chat de WhatsApp flotante -->
<div class="g-chat" id="gChat">
    <!-- Ventana del chat -->
    <section class="g-chat__box" id="chatBox" role="dialog" aria-label="Chat con Pilates Gravity" aria-hidden="true">
        <header class="g-chat__head">
            <span class="g-chat__avatar"><img src="{% static 'img/solo_logo_blanco.webp' %}" alt=""></span>
            <div class="g-chat__who">
                <strong>Pilates Gravity</strong>
                <span><i></i>Respondemos por WhatsApp</span>
            </div>
            <button type="button" class="g-chat__close" id="closeChat" aria-label="Cerrar chat">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
            </button>
        </header>

        <div class="g-chat__body">
            <div class="g-chat__bubble">
                ¡Hola! 👋 ¿Cómo estás?<br>
                Contanos en qué podemos ayudarte.
                <small>Pilates Gravity</small>
            </div>
            <div class="g-chat__chips" aria-label="Respuestas rápidas">
                <button type="button" data-chat-chip="¡Hola! Quiero reservar mi primera clase.">Quiero mi primera clase</button>
                <button type="button" data-chat-chip="¡Hola! Quería consultar los precios.">Consultar precios</button>
                <button type="button" data-chat-chip="¡Hola! ¿Qué horarios tienen disponibles?">Horarios disponibles</button>
            </div>
        </div>

        <div class="g-chat__composer">
            <textarea id="whatsappMessage" rows="2" placeholder="Escribí tu mensaje…"></textarea>
            <button type="button" class="g-chat__send" id="startWhatsapp" aria-label="Enviar por WhatsApp">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3.4 20.4 21 12 3.4 3.6 3.4 10l12.6 2-12.6 2z"/></svg>
            </button>
        </div>
        <p class="g-chat__note">Se abrirá WhatsApp con tu mensaje</p>
    </section>

    <!-- Botón de apertura -->
    <button type="button" class="g-chat__launcher" id="openChat" aria-label="Abrir chat de WhatsApp" aria-controls="chatBox" aria-expanded="false">
        <svg class="g-chat__icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12.04 2a9.9 9.9 0 0 0-8.5 15l-1.5 5 5.2-1.4A9.9 9.9 0 1 0 12.04 2Zm0 18.1a8.2 8.2 0 0 1-4.2-1.15l-.3-.18-3.1.82.83-3-.2-.31a8.2 8.2 0 1 1 6.97 3.82Zm4.5-6.14c-.25-.12-1.46-.72-1.69-.8-.23-.08-.39-.12-.55.12-.16.25-.63.8-.78.96-.14.17-.29.19-.53.06-.25-.12-1.04-.38-1.98-1.22-.73-.65-1.23-1.46-1.37-1.7-.14-.25-.02-.38.11-.5.11-.11.25-.29.37-.44.12-.14.16-.25.25-.41.08-.17.04-.31-.02-.44-.06-.12-.55-1.33-.76-1.82-.2-.48-.4-.41-.55-.42h-.47a.9.9 0 0 0-.65.31c-.23.25-.86.84-.86 2.05s.88 2.38 1 2.55c.12.16 1.73 2.64 4.2 3.7.59.25 1.05.4 1.4.52.59.19 1.13.16 1.55.1.47-.07 1.46-.6 1.67-1.18.2-.58.2-1.07.14-1.18-.06-.1-.22-.16-.47-.29Z"/></svg>
        <svg class="g-chat__x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
        <span class="g-chat__badge" id="whatsappNotification">1</span>
    </button>
</div>
