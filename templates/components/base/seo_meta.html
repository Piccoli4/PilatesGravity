{% load static %}
{# Metadatos de SEO y redes sociales. Los textos salen de gravity/seo.py (context processor "seo"). #}
<meta name="description" content="{{ seo.descripcion }}">
{% if seo.indexable %}
<meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1">
<link rel="canonical" href="{{ seo.canonical }}">
{% else %}
<meta name="robots" content="noindex, follow">
{% endif %}

<!-- Open Graph (WhatsApp, Facebook, Instagram, LinkedIn) -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Pilates Gravity">
<meta property="og:locale" content="es_AR">
<meta property="og:title" content="{{ seo.titulo }}">
<meta property="og:description" content="{{ seo.descripcion }}">
<meta property="og:url" content="{{ seo.canonical }}">
<meta property="og:image" content="{{ seo.imagen }}">
<meta property="og:image:secure_url" content="{{ seo.imagen }}">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{{ seo.imagen_alt }}">

<!-- X / Twitter -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ seo.titulo }}">
<meta name="twitter:description" content="{{ seo.descripcion }}">
<meta name="twitter:image" content="{{ seo.imagen }}">
<meta name="twitter:image:alt" content="{{ seo.imagen_alt }}">

<!-- Íconos -->
<link rel="icon" href="{% static 'favicon.ico' %}?v=2" sizes="48x48">
<link rel="icon" type="image/svg+xml" href="{% static 'favicon.svg' %}?v=2">
<link rel="icon" type="image/png" sizes="32x32" href="{% static 'favicon-32x32.png' %}?v=2">
<link rel="icon" type="image/png" sizes="16x16" href="{% static 'favicon-16x16.png' %}?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="{% static 'apple-touch-icon.png' %}?v=2">

{% if seo.json_ld %}
<script type="application/ld+json">{{ seo.json_ld|safe }}</script>
{% endif %}
