{# Campo de contraseña con botón para mostrarla. Nunca vuelve a escribir el valor en la página. #}
<div class="pc-field pw-field {% if field.errors %}has-error{% endif %}">
    <div class="pw-label">
        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
        {% if link_url %}<a href="{{ link_url }}" class="me-link">{{ link_txt }}</a>{% endif %}
    </div>
    <div class="pw-input">
        {{ field }}
        <button type="button" class="pw-eye" data-ver-password="{{ field.id_for_label }}" aria-label="Mostrar contraseña">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
    </div>
    {% for error in field.errors %}<small class="pc-error">{{ error }}</small>{% endfor %}
</div>
