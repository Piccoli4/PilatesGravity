{% extends 'accounts/auth_simple.html' %}

{% block title %}Contraseña actualizada{% endblock %}

{% block card %}
    <span class="ac-ok" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
    </span>
    <span class="auth-eyebrow">Listo</span>
    <h1 class="auth-title">Ya tenés tu nueva contraseña</h1>
    <p class="auth-sub">Entrá con tu usuario y la contraseña que acabás de elegir.</p>

    <div class="auth-card__actions">
        <a href="{% url 'accounts:login' %}" class="auth-btn">Iniciar sesión</a>
        <a href="{% url 'gravity:home' %}" class="auth-ghost">Ir al inicio</a>
    </div>
{% endblock %}
