<div class="input-group{% if field.errors %} has-error{% endif %}">
    {% if icon == 'mail' %}
        <svg class="ig-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M4 5h16a2 2 0 0 1 2 2v.4l-10 6.25L2 7.4V7a2 2 0 0 1 2-2Zm-2 4.75 9.47 5.92a1 1 0 0 0 1.06 0L22 9.75V17a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9.75Z"/></svg>
    {% elif icon == 'lock' %}
        <svg class="ig-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M17 9h-1V7a4 4 0 1 0-8 0v2H7a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-9a2 2 0 0 0-2-2Zm-7-2a2 2 0 1 1 4 0v2h-4V7Z"/></svg>
    {% elif icon == 'phone' %}
        <svg class="ig-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.24c1.1.36 2.3.56 3.6.56a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.3.2 2.5.56 3.6a1 1 0 0 1-.25 1L6.6 10.8Z"/></svg>
    {% elif icon == 'at' %}
        <svg class="ig-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-3.9 7.9"/></svg>
    {% else %}
        <svg class="ig-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 12a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9Zm0 2.25c-4.1 0-8.25 2.07-8.25 5.25 0 .62.5 1.13 1.13 1.13h14.24c.62 0 1.13-.5 1.13-1.13 0-3.18-4.15-5.25-8.25-5.25Z"/></svg>
    {% endif %}
    <input type="{{ type }}" name="{{ field.html_name }}" id="{{ id }}" placeholder=" " autocomplete="{{ ac }}"
           {% if type != 'password' %}value="{{ field.value|default_if_none:'' }}"{% endif %}
           {% if field.name == 'username' %}autocapitalize="none"{% endif %} required>
    <label for="{{ id }}">{{ label }}</label>
    {% if type == 'password' %}
        <button type="button" class="ig-eye" data-toggle-password="{{ id }}" aria-label="Mostrar contraseña">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
        <small class="ig-caps">Mayúsculas activadas</small>
    {% endif %}
    {% if field.errors %}
        <small class="ig-error">{% for e in field.errors %}{{ e }} {% endfor %}</small>
    {% endif %}
</div>
